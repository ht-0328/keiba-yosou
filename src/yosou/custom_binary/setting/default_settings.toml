# 「特徴量と条件を選んで予想」のハイパーパラメータの初期値（設計書 14）。
# 値は、手本の予想（近走と適性から3着以内を予想）の初期値と同じ。予想のパッケージどうしで import しないよう、ここに持つ。
# 設定の YAML の lightgbm・catboost に書いた項目だけが置き換わる。
# ここに無い名前は書けない（書き間違いを黙って無視しないため）。目的関数は変えられない（設計書 14）。

[lightgbm]
early_stopping_rounds = 100   # 検証データで、木を何本足しても良くならなければ止めるか
min_category_count = 2000     # 学習データでの出走がこれより少ないカテゴリの値は「その他」にまとめる

[lightgbm.params]             # LGBMClassifier の引数。書いたものがそのまま渡る
learning_rate = 0.05
n_estimators = 2000           # 木の数の上限
num_leaves = 31
min_child_samples = 100
subsample = 0.8
subsample_freq = 1
colsample_bytree = 0.8
random_state = 42

[catboost]
early_stopping_rounds = 100

[catboost.params]             # CatBoostClassifier の引数。書いたものがそのまま渡る
learning_rate = 0.05
iterations = 2000             # 木の数の上限
depth = 6
l2_leaf_reg = 3
random_seed = 42
