# nameごとに独立したモデルを保存。同名への上書きはしない。
name: top3_pop6_10
features_file: features.txt
target: 馬券内  # 馬券内 / 馬券外 / 勝利
timing: 当日    # 木曜 / 前日 / 当日

popularity:
  min: 6
  max: 10

# 特徴量の値で対象を絞る（省略可）。すべてに当てはまる馬だけで学習・評価・予想する。
# conditions:
#   芝ダ: 芝
#   距離: {max: 1400}
#   馬体重: {max: 440}

# オッズから見た確率を出発点にする（前日・当日のみ）。期待値で買うなら true にする。
# odds_baseline: true

# 省略時もこの期間を使用。warmupは過去走を作るためだけに使う。
training:
  warmup_from: 2020-01-01
  train_from: 2021-08-01
  valid_from: 2025-07-01
  test_from: 2026-01-01

# 必要な設定だけ上書きできる。目的関数は二値分類に固定。
# lightgbm:
#   early_stopping_rounds: 100
#   min_category_count: 2000
#   params:
#     n_estimators: 2000
#     learning_rate: 0.05
# catboost:
#   early_stopping_rounds: 100
#   params:
#     iterations: 2000
#     depth: 6
